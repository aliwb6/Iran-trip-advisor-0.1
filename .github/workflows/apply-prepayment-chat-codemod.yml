name: Apply pre-payment chat codemod

on:
  push:
    branches:
      - feature/prepayment-chat-contact-release

permissions:
  contents: write

jobs:
  patch-test-build:
    if: contains(github.event.head_commit.message, 'run verified prepayment chat')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/prepayment-chat-contact-release
          fetch-depth: 0

      - name: Apply deterministic patches
        run: |
          node scripts/apply-prepayment-chat-ui-patches.mjs
          node scripts/fix-prepayment-chat-test-regressions.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run full suite and verify known baseline failures only
        run: |
          set +e
          npm test 2>&1 | tee prepayment-chat-test-output.txt
          test_status=${PIPESTATUS[0]}
          set -e
          echo "full suite exit status: ${test_status}"
          node scripts/verify-prepayment-chat-test-baseline.mjs prepayment-chat-test-output.txt

      - name: Run focused communication and payment tests
        run: node --test test/paymentChatUnlock15.test.js test/phase3aProfilePrivacyPrimitives.test.js test/phase3bPaymentUI.test.js

      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepayment-chat-test-output
          path: prepayment-chat-test-output.txt
          if-no-files-found: warn

      - name: Build production bundle
        run: npm run build

      - name: Remove temporary codemod files
        run: |
          rm -f scripts/apply-prepayment-chat-ui-patches.mjs
          rm -f scripts/fix-prepayment-chat-test-regressions.mjs
          rm -f scripts/verify-prepayment-chat-test-baseline.mjs
          rm -f .github/workflows/apply-prepayment-chat-codemod.yml
          rm -f prepayment-chat-test-output.txt

      - name: Commit verified changes
        run: |
          git config user.name "iran-trip-advisor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: enable pre-payment chat with protected contacts"
          git push origin HEAD:feature/prepayment-chat-contact-release
